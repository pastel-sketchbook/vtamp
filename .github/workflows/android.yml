name: Android checks
on:
  push:
    paths: ['android/**', 'ios/Tests/Fixtures/**', 'tests/fixtures/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'ios/Tests/Fixtures/**', 'tests/fixtures/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action defaults to the retired "tools" package as well.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.13113456' 'cmake;3.22.1'
      - uses: actions/cache@v4
        with:
          path: android/Vendor
          key: android-decoder-${{ runner.os }}-${{ hashFiles('android/scripts/build-decoder.sh') }}
      - run: android/scripts/build-decoder.sh
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug
        working-directory: android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: cd android && ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-api-${{ matrix.api }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            android/decoder/build/reports/
