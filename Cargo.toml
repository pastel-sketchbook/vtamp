[package]
name = "vtamp"
version = "0.1.0"
authors = ["Jang-Ho Hwang <rath@xrath.com>"]
homepage = "https://github.com/rath/vtamp"
repository = "https://github.com/rath/vtamp"
edition = "2024"
rust-version = "1.90"
description = "Music stays. Your terminal moves on. A detachable terminal music player."
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
directories = "6"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
lofty = "0.25"
# Handles extended-size mdat atoms found in real-world m4a files.
mp4ameta = "0.13"
rand = "0.9"
ratatui = "0.30"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
rodio = { version = "0.22", default-features = false, features = ["playback", "mp4", "symphonia-alac", "mp3", "flac", "wav", "vorbis", "tracing"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSRunningApplication", "NSEvent", "NSGraphicsContext", "NSResponder", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSValue", "NSData", "NSDate", "NSGeometry", "NSObject", "NSThread", "NSError", "NSURL"] }
objc2-media-player = { version = "0.3", default-features = false, features = ["std", "block2", "MPRemoteCommandCenter", "MPRemoteCommand", "MPRemoteCommandEvent", "MPNowPlayingInfoCenter", "MPMediaItem", "MPMediaEntity", "objc2-app-kit", "objc2-core-foundation"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
